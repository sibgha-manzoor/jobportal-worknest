<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Edit Job – WorkNest</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <div class="logo">Work<span>Nest</span><span class="logo-dot"></span></div>
  <div class="nav-links">
    <a th:href="@{/recruiter/rdashboard}" style="color:var(--slate); font-weight:600;">Dashboard</a>
    <a th:href="@{/logout}">Log Out</a>
  </div>
</nav>

<div class="edit-job-page">
  <div class="edit-job-card">

    <div class="edit-job-header">
      <h2>Edit Job Listing</h2>
    </div>

    <div class="edit-job-body">
      <!-- BACKEND BINDING UNCHANGED: form action, th:object, th:field preserved -->
      <form th:action="@{/recruiter/updatejob}" th:object="${job}" method="post">
        <input type="hidden" th:field="*{jobId}" />

        <div class="form-group">
          <label for="jobTitle">Job Title</label>
          <input type="text" id="jobTitle" th:field="*{jobTitle}" placeholder="e.g. Senior Software Engineer" required />
        </div>

        <div class="form-group">
          <label for="jobCompany">Company</label>
          <input type="text" id="jobCompany" th:field="*{jobCompany}" placeholder="e.g. Acme Corp" required />
        </div>

        <div class="form-group full">
          <label for="jobDesc">Job Description</label>
          <input type="text" id="jobDesc" th:field="*{jobDesc}" placeholder="Brief description of the role..." required />
        </div>

        <div class="form-group">
          <label for="jobLoc">Location</label>
          <input type="text" id="jobLoc" th:field="*{jobLoc}" placeholder="e.g. New York, NY" required />
        </div>

        <div class="form-group">
          <label for="jobSalary">Salary Range</label>
          <input type="text" id="jobSalary" th:field="*{jobSalary}" placeholder="e.g. $80,000 – $100,000" required />
        </div>

        <div class="form-group">
          <label for="jobQualification">Required Qualification</label>
          <input type="text" id="jobQualification" th:field="*{jobQualification}" placeholder="e.g. Bachelor's in CS" required />
        </div>

        <div class="form-group">
          <label for="vacancy">Vacancies</label>
          <input type="number" id="vacancy" th:field="*{vacancy}" min="1" placeholder="e.g. 3" />
        </div>

        <div class="form-group">
          <label for="applicationDeadline">Application Deadline</label>
          <input type="date" id="applicationDeadline" th:field="*{applicationDeadline}" />
        </div>

        <div class="form-group">
          <label for="jobType">Job Type</label>
          <select id="jobType" th:field="*{jobType}">
            <option value="">-- Select Type --</option>
            <option value="Full-Time">Full-Time</option>
            <option value="Part-Time">Part-Time</option>
            <option value="Contract">Contract</option>
            <option value="Internship">Internship</option>
            <option value="Remote">Remote</option>
          </select>
        </div>

        <div class="form-group">
          <label for="jobPostedBy">Posted By</label>
          <input type="text" id="jobPostedBy" th:field="*{jobPostedBy}" required />
        </div>

        <button type="submit" style="grid-column:1/-1; width:100%; padding:13px; font-size:.9rem; font-weight:700; border:none; cursor:pointer; border-radius:var(--r-full); background:var(--violet); color:var(--surface); font-family:var(--font-body); transition:background var(--t) var(--ease), box-shadow var(--t) var(--ease);">
          Save Changes
        </button>
      </form>

      <div class="back-home" style="margin-top:20px;">
        <a th:href="@{/recruiter/rdashboard}" style="color:var(--violet-dk); font-weight:600; font-size:.875rem;">Back to Dashboard</a>
      </div>
    </div>

  </div>
</div>

</body>
</html>
