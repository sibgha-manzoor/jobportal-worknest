<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signed Out – WorkNest</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body>

<div class="logout-page">
  <div class="logout-card">
    <div style="width:56px; height:56px; background:var(--violet-lt); border-radius:var(--r-xl); display:flex; align-items:center; justify-content:center; margin:0 auto 24px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--violet)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    <h1>See you soon</h1>
    <p>You have been signed out securely. Your applications and profile are safe whenever you return.</p>

    <a th:href="@{/login}" class="btn-apply btn" style="margin-bottom:12px; padding:13px; display:block; text-align:center;">Sign Back In</a>
    <a th:href="@{/}" class="btn" style="background:var(--surface-2); color:var(--slate); border:1.5px solid var(--border); display:block; text-align:center; padding:13px;">Back to Home</a>
  </div>
</div>

</body>
</html>
